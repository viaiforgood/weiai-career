<!DOCTYPE html>
<html lang="zh-CN" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViVouch 校友举荐 · 北美高校校友具名举荐与内推协作平台</title>
    <meta name="description" content="ViVouch 校友举荐 由 唯爱AI公益基金会、北美高校联盟北加州分会、北美高校联盟AI创业公益俱乐部、北美浙江大学校友会北卡分会 联合发起。有校友具名，才叫举荐。以校友具名背书击碎简历海投，15 分钟短效预签名保护隐私，全程五态透明跟踪。Vouched by alumni. Submitted by them." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      // Domain & Shortlink Auto-Routing
      var host = window.location.hostname;
      if (host === 'vivouch.weiai.ai' || host === 'vivouch.vi.fyi') {
        window.location.replace('https://career.weiai.ai' + window.location.pathname + window.location.search);
      } else if (
        host === 'r.vi.fyi' || 
        host === 'v.vi.fyi' || 
        host === 'refer.vi.fyi' ||
        host === 'vouch.vi.fyi'
      ) {
        window.location.replace('https://career.weiai.ai/?role=referrer' + (window.location.search ? '&' + window.location.search.slice(1) : ''));
      } else if (host === 'c.vi.fyi' || host === 'career.vi.fyi') {
        window.location.replace('https://career.weiai.ai/?role=seeker' + (window.location.search ? '&' + window.location.search.slice(1) : ''));
      } else if (host.endsWith('vi.fyi')) {
        window.location.replace('https://career.weiai.ai' + window.location.pathname + window.location.search);
      }
    </script>
  </head>
  <body class="bg-[#050b18] text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
